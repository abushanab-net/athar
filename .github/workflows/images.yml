name: images

# Phase P (T094): the deployment images, pushed to GHCR. Every pull request builds them (no push) so a broken Dockerfile
# fails early; pushes to develop and main and release tags publish them for deploy/docker-compose.yml.
on:
  pull_request:
    paths: ["deploy/**", "src/**", "agent-skills/**", "agent-plugin/**", "Directory.Packages.props", "global.json", ".github/workflows/images.yml"]
  push:
    branches: [develop, main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

# A new push to a pull request cancels its older build; pushes to develop, main and tags publish, so they always finish.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [web, worker, collab, backup]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/athar-${{ matrix.component }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.component }}.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # T098: the backup round trip (pg_dump + attachments + keys, age, S3 via rclone serve s3, retention, restore) on every change.
  backup-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: deploy/backup/selftest.sh

# Athar pilot stack (Phase P, T094): Postgres + pgvector, web, worker and collab on one on-prem server.
# Models come from the model gateway (Athar__Ai__*), not from a container here. The reverse proxy (Caddy, deploy/Caddyfile)
# is the only entry point: the LAN app on ATHAR_LAN_PORT, and the two public hosts on ATHAR_MCP_PORT and ATHAR_SHARE_PORT,
# which only Pangolin should reach. web is also on the loopback interface for checks.
#
#   cp deploy/.env.example deploy/.env      # fill in the secrets (never commit deploy/.env)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env run --rm web bootstrap --email owner@company.com
#
# Images: pulled from GHCR (built by .github/workflows/images.yml) or built here with `--build`.

name: athar

x-images: &image-defaults
  pull_policy: missing

x-common-env: &common-env
  ConnectionStrings__athar: "Host=postgres;Port=5432;Database=athar;Username=athar;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}"
  Athar__Ai__BaseUrl: "${ATHAR_AI_BASE_URL:-http://192.168.1.10:8080/v1}"
  Athar__Ai__ApiKey: "${ATHAR_AI_API_KEY:?set ATHAR_AI_API_KEY in deploy/.env}"
  Athar__Ai__ChatModel: "${ATHAR_AI_CHAT_MODEL:-Qwen3.6-35B-A3B-NVFP4}"
  Athar__Ai__EmbeddingModel: "${ATHAR_AI_EMBEDDING_MODEL:-Qwen3-Embedding-4B}"
  Athar__Ai__Dimensions: "1024"
  Athar__GitHub__AllowedRepos__0: "${ATHAR_GITHUB_ALLOWED_REPOS:-your-org/*}"
  DOTNET_ENVIRONMENT: Production

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: athar
      POSTGRES_DB: athar
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athar -d athar"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    <<: *image-defaults
    image: "${ATHAR_IMAGE_PREFIX:-ghcr.io/abushanab-net/athar}-web:${ATHAR_TAG:-latest}"
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *common-env
      ASPNETCORE_ENVIRONMENT: Production
      # web migrates the database at startup, then seeds the minimal profile (the organization; the first owner comes from bootstrap).
      Athar__Seed: minimal
      # The internal app host (wiki UI, links in emails) and the public agents host (OAuth issuer, MCP resource), docs/03 §2.
      Athar__AppUrl: "${ATHAR_APP_URL:?set ATHAR_APP_URL in deploy/.env}"
      Athar__PublicUrl: "${ATHAR_MCP_URL:?set ATHAR_MCP_URL in deploy/.env}"
      Athar__Smtp__Host: "${ATHAR_SMTP_HOST:?set ATHAR_SMTP_HOST in deploy/.env}"
      Athar__Smtp__Port: "${ATHAR_SMTP_PORT:-587}"
      Athar__Smtp__StartTls: "${ATHAR_SMTP_STARTTLS:-true}"
      Athar__Smtp__User: "${ATHAR_SMTP_USER:-}"
      Athar__Smtp__Password: "${ATHAR_SMTP_PASSWORD:-}"
      Athar__Smtp__From: "${ATHAR_SMTP_FROM:?set ATHAR_SMTP_FROM in deploy/.env}"
      # collab: the internal API address web calls, the shared secret, and the WebSocket address browsers use (via the proxy, T096).
      services__collab__http__0: http://collab:1234
      Collab__Secret: "${COLLAB_SECRET:?set COLLAB_SECRET in deploy/.env}"
      Collab__PublicUrl: "${ATHAR_APP_URL}/collab"
      # The public share host, for the share links people copy (T096).
      Athar__ShareUrl: "${ATHAR_SHARE_URL:-https://athar-share.example.com}"
    volumes:
      - keys:/data/keys
      - attachments:/data/attachments
    ports:
      - "127.0.0.1:${ATHAR_WEB_PORT:-8080}:8080"

  worker:
    <<: *image-defaults
    image: "${ATHAR_IMAGE_PREFIX:-ghcr.io/abushanab-net/athar}-worker:${ATHAR_TAG:-latest}"
    build: { context: .., dockerfile: deploy/worker.Dockerfile }
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy } # web applies the migrations
    environment:
      <<: *common-env
      Athar__Extraction__AutoPull: "false" # no Ollama in production
    volumes:
      - keys:/data/keys
      - attachments:/data/attachments

  collab:
    <<: *image-defaults
    image: "${ATHAR_IMAGE_PREFIX:-ghcr.io/abushanab-net/athar}-collab:${ATHAR_TAG:-latest}"
    build: { context: .., dockerfile: deploy/collab.Dockerfile }
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    environment:
      WEB_URL: http://web:8080
      COLLAB_SECRET: "${COLLAB_SECRET:?set COLLAB_SECRET in deploy/.env}"

  backup:
    <<: *image-defaults
    image: "${ATHAR_IMAGE_PREFIX:-ghcr.io/abushanab-net/athar}-backup:${ATHAR_TAG:-latest}"
    build: { context: .., dockerfile: deploy/backup.Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    # NFR-08 (T098): one backup at start, then nightly, to the KSA bucket; deploy/README.md "Backups" and "Restore".
    environment:
      TZ: "${BACKUP_TZ:-Asia/Riyadh}"
      BACKUP_AT: "${BACKUP_AT:-02:00}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT in deploy/.env}"
      BACKUP_S3_BUCKET: "${BACKUP_S3_BUCKET:?set BACKUP_S3_BUCKET in deploy/.env}"
      BACKUP_S3_PREFIX: "${BACKUP_S3_PREFIX:-athar}"
      RCLONE_CONFIG_KSA_TYPE: s3
      RCLONE_CONFIG_KSA_PROVIDER: "${BACKUP_S3_PROVIDER:-Other}"
      RCLONE_CONFIG_KSA_ENDPOINT: "${BACKUP_S3_ENDPOINT:?set BACKUP_S3_ENDPOINT in deploy/.env}"
      RCLONE_CONFIG_KSA_REGION: "${BACKUP_S3_REGION:-}"
      RCLONE_CONFIG_KSA_ACCESS_KEY_ID: "${BACKUP_S3_ACCESS_KEY_ID:?set BACKUP_S3_ACCESS_KEY_ID in deploy/.env}"
      RCLONE_CONFIG_KSA_SECRET_ACCESS_KEY: "${BACKUP_S3_SECRET_ACCESS_KEY:?set BACKUP_S3_SECRET_ACCESS_KEY in deploy/.env}"
      RCLONE_CONFIG_KSA_NO_CHECK_BUCKET: "true" # the bucket exists; a write-only key may not list buckets
      PGHOST: postgres
      PGUSER: athar
      PGDATABASE: athar
      PGPASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}"
    volumes:
      - attachments:/data/attachments
      - keys:/data/keys
    healthcheck:
      # Red when no backup has succeeded for 26 hours (RPO 24 h, NFR-08).
      test: ["CMD-SHELL", "test -f /tmp/last-success && [ $$(( $$(date +%s) - $$(cat /tmp/last-success) )) -lt 93600 ]"]
      interval: 10m
      start_period: 30m

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    ports:
      - "${ATHAR_LAN_PORT:-80}:80"        # internal host: the whole app on the LAN
      - "${ATHAR_MCP_PORT:-8081}:8081"    # athar-mcp.example.com, Pangolin's target
      - "${ATHAR_SHARE_PORT:-8082}:8082"  # athar-share.example.com, Pangolin's target
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:       # the database (backed up nightly with attachments, T098)
  keys:         # Data Protection and OpenIddict keys (backed up separately, T098)
  attachments:  # uploaded files
